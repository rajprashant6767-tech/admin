<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch & Earn</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11590181"
        data-sdk="show_11590181">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-top: 8px;
        }

        .coin-box {
            margin: 25px 0;
            padding: 20px;
            border-radius: 18px;
            background: #f7f8fa;
        }

        .coin-title {
            font-size: 14px;
            color: #777;
        }

        .coins {
            margin-top: 5px;
            font-size: 38px;
            font-weight: bold;
        }

        .watch-btn {
            width: 100%;
            border: 0;
            border-radius: 15px;
            padding: 17px;
            background: #2481cc;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .watch-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            min-height: 25px;
            margin-top: 18px;
            font-size: 14px;
        }

        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="card">

        <div class="logo">🎁</div>

        <h1>Watch & Earn</h1>

        <div class="subtitle">
            Watch ads and earn coins
        </div>

        <div class="coin-box">

            <div class="coin-title">
                Your Coins
            </div>

            <div class="coins">
                🪙 <span id="coins">0</span>
            </div>

        </div>

        <button
            id="watchBtn"
            class="watch-btn"
            onclick="watchAd()">
            ▶ WATCH AD
        </button>

        <div
            id="status"
            class="status">
        </div>

        <div class="info">
            Complete the ad to receive your reward.
        </div>

    </div>

</div>

<script>

    // -----------------------------
    // Telegram Mini App
    // -----------------------------

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // -----------------------------
    // Coins
    // -----------------------------

    let coins = Number(
        localStorage.getItem("coins") || 0
    );

    const coinsElement =
        document.getElementById("coins");

    const watchBtn =
        document.getElementById("watchBtn");

    const status =
        document.getElementById("status");


    coinsElement.textContent = coins;


    // -----------------------------
    // Add Reward
    // -----------------------------

    function addReward() {

        coins += 10;

        localStorage.setItem(
            "coins",
            coins
        );

        coinsElement.textContent =
            coins;

        status.textContent =
            "✅ Ad completed! +10 coins";
    }


    // -----------------------------
    // Watch Ad
    // -----------------------------

    async function watchAd() {

        if (
            typeof show_11590181 !==
            "function"
        ) {

            status.textContent =
                "❌ Monetag ad is not loaded.";

            return;
        }


        watchBtn.disabled = true;

        status.textContent =
            "⏳ Loading ad...";


        try {

            await show_11590181();


            // Reward after the
            // Monetag promise resolves

            addReward();

        }

        catch (error) {

            console.error(
                "Monetag error:",
                error
            );

            status.textContent =
                "❌ Ad was not completed.";

        }

        finally {

            watchBtn.disabled =
                false;

        }

    }

</script>

</body>
</html>
