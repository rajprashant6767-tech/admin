<!DOCTYPE html>

<head>

<title>Admolo Test</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:15px;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}
h2{font-size:18px}
.card{
  margin:15px 0;
  padding:15px;
  background:#1e293b;
  border-radius:12px;
}
.banner{
  width:300px;
  max-width:100%;
  min-height:300px;
  margin:auto;
  text-align:center;
}
.info{
  color:#94a3b8;
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>

<h2>Admolo Ads Test</h2>

<div class="card">
  <h2>Square Banner 300 × 300</h2>

  <div class="banner">
    <div class="admoloBanner"
    data-publisher="eyJpdiI6IlJqT29jOUlQOTgyZU5FSnp2M083aGc9PSIsInZhbHVlIjoiQ2pqZlN2UnVseFREN1ZyYVRnaTUzQT09IiwibWFjIjoiMDhmNDQ4ZmNhOGRhYzFiNTQ1N2VlNDdiY2U3ZGJlOTg3OTg0ODFlZmI0YTgyYTM1YzZlMTk5ZDZkZGFkM2JkZSIsInRhZyI6IiJ9"
    data-adsize="300x300"></div>
  </div>
</div>

<div class="card">
  <h2>Interstitial</h2>

  <div class="admoloInterstitial"
  data-publisher="eyJpdiI6ImF1c3J2NzJhVDFmKzN3cjZSYktIZGc9PSIsInZhbHVlIjoiUW9EdnJ3TVJjMzlPS3ZSRnhZTjJSUT09IiwibWFjIjoiNjgzMzFmMzU0YmY5OWY1M2VkYTMwMDJjYzEyNTJkZjA3Njc2ZjBiYjFmOWRiMDJlMGIxNGI4MjJlMDJhMjBjOSIsInRhZyI6IiJ9"

  <p class="info">Interstitial placement</p>
</div>

<p class="info" id="status">Loading Admolo...</p>

<script
class="admoloScript"
src="https://cdn.admolo.com/assets/ads/ad.js"
onload="document.getElementById('status').textContent='Admolo script loaded';"
onerror="document.getElementById('status').textContent='Admolo script failed';">
</script>

</html>
